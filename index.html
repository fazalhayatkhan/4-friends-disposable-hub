<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The 4 Friends Disposable Hub</title>
<style>
:root{--bg:#F3F7F6; --surface:#FFFFFF; --ink:#0E2A2B; --muted:#52706E; --line:#D5E3E1; --teal:#0B8A7F; --teal-d:#086B62; --on-teal:#FFFFFF; --tint:#E1F2EF; --navy:#14306B; --on-navy:#FFFFFF; --wa:#168A45; --on-wa:#FFFFFF; --red:#D9363E;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:sans-serif;margin:0;font-size:15px}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px}
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:42px;height:42px;border-radius:10px;background:var(--navy);color:var(--on-navy);display:flex;align-items:center;justify-content:center;font-weight:800}
.bname{font-weight:800;font-size:18px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn-teal{background:var(--teal);color:var(--on-teal)}
.btn-wa{background:var(--wa);color:var(--on-wa)}
.icon-btn{width:40px;height:40px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer}
.cart-btn{position:relative}
.badge{background:var(--red);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center}
.hero{padding-block:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.p{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.p h3{margin:0;font-size:16px}
.p-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.step{display:inline-flex;align-items:center;border:1px solid var(--teal);border-radius:8px;overflow:hidden}
.step button{width:30px;height:30px;border:0;background:var(--tint);color:var(--teal);font-weight:bold;cursor:pointer}
.step output{padding-inline:8px;font-weight:bold}

/* Drawer CSS fix to keep it hidden by default */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.25)}
.drawer[hidden]{display:none !important}
.scrim{position:fixed;inset:0;background:rgba(5,15,16,.55);z-index:40}
.scrim[hidden]{display:none !important}

.d-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.d-body{flex:1;overflow:auto;padding:14px 16px}
.d-foot{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:10px;background:var(--bg)}
.disabled{opacity:.5;pointer-events:none}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#">
      <div class="mark">4F</div>
      <div><div class="bname">THE 4 FRIENDS</div><small style="color:var(--teal);font-weight:700">Disposable Hub</small></div>
    </a>
    <div style="margin-left:auto;display:flex;gap:8px">
      <button class="btn btn-teal cart-btn" id="open-cart">Order list <span class="badge" id="count">0</span></button>
    </div>
  </div>
</header>
<main class="wrap hero">
  <h1>The 4 Friends Disposable Hub</h1>
  <p>Sagle disposable items wholesale ani retail rates madhye uplabdh ahet. Baghderai Chowk, Madyan Road.</p>
  <div class="grid" id="grid"></div>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden>
  <div class="d-head"><h3>Your order list</h3><button class="icon-btn" id="close-cart">X</button></div>
  <div class="d-body" id="lines"></div>
  <div class="d-foot">
    <input id="cn" type="text" placeholder="Tumche nav" style="padding:10px;border-radius:8px;border:1px solid var(--line);width:100%">
    <input id="cp" type="tel" placeholder="Mobile number" style="padding:10px;border-radius:8px;border:1px solid var(--line);width:100%">
    <a class="btn btn-wa disabled" id="send" href="#" target="_blank" rel="noopener" style="text-align:center">WhatsApp var order pathva</a>
  </div>
</aside>

<script>
var P=[
  {id:1,name:'Food Container 1000 ml',unit:'1000 ml',desc:'Disposable food container.'},
  {id:2,name:'Foam Meal Box Size 22',unit:'Size 22',desc:'Thermocol meal box.'},
  {id:3,name:'Paper Plate Large',unit:'Large',desc:'Paper plate for parties.'},
  {id:4,name:'Tea Paper Cup',unit:'Pack',desc:'Disposable tea cup.'},
  {id:5,name:'Shopper Bags Bundle',unit:'Bundle',desc:'Shopper bags for shops.'},
  {id:6,name:'Tissues Box',unit:'Box',desc:'Facial and table tissues.'}
];
var cart={};
var $=function(s){return document.querySelector(s)};
function renderGrid(){
  $('#grid').innerHTML=P.map(function(p){
    var n=cart[p.id]||0;
    var btn=n===0?'<button class="btn btn-teal" onclick="change('+p.id+',1)">Add</button>':'<div class="step"><button onclick="change('+p.id+',-1)">-</button><output>'+n+'</output><button onclick="change('+p.id+',1)">+</button></div>';
    return '<div class="p"><span>'+p.unit+'</span><h3>'+p.name+'</h3><p style="color:#52706E;font-size:13px;margin:0">'+p.desc+'</p><div class="p-foot"><b>Ask price</b>'+btn+'</div></div>';
  }).join('');
}
function change(id,d){
  var n=(cart[id]||0)+d;
  if(n<=0)delete cart[id];else cart[id]=n;
  renderGrid();renderCart();
}
function renderCart(){
  var keys=Object.keys(cart);
  $('#count').textContent=keys.reduce(function(s,k){return s+cart[k]},0);
  $('#lines').innerHTML=keys.length?keys.map(function(k){
    var p=P.find(function(x){return x.id==k});
    return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #D5E3E1"><span>'+p.name+' x '+cart[k]+'</span></div>';
  }).join(''):'<div style="text-align:center;color:#52706E;padding:40px">Tumchi list khali ahe.</div>';
  var a=$('#send');a.classList.toggle('disabled',!keys.length);
  if(keys.length){
    var msg='*NEW ORDER - THE 4 FRIENDS DISPOSABLE HUB*\n\nName: '+($('#cn').value||'N/A')+'\nPhone: '+($('#cp').value||'N/A')+'\n\nItems:\n';
    keys.forEach(function(k){var p=P.find(function(x){return x.id==k});msg+='- '+p.name+' x '+cart[k]+'\n'});
    a.href='https://wa.me/923486099280?text='+encodeURIComponent(msg);
  }
}
$('#open-cart').addEventListener('click',function(){$('#drawer').hidden=false;$('#scrim').hidden=false;renderCart()});
$('#close-cart').addEventListener('click',function(){$('#drawer').hidden=true;$('#scrim').hidden=true});
$('#scrim').addEventListener('click',function(){$('#drawer').hidden=true;$('#scrim').hidden=true});
['#cn','#cp'].forEach(function(s){$(s).addEventListener('input',renderCart)});
renderGrid();renderCart();
</script>
</body>
</html>
